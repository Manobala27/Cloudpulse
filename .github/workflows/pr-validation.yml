name: Pull Request Validation

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  validate-python:
    name: Python CI (Lint & Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r backend/src/requirements.txt

      - name: Run Black Check
        run: black --check .

      - name: Run Ruff Lint
        run: ruff check .

      - name: Run Pytest
        run: python -m pytest backend/

  validate-sam:
    name: AWS SAM Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-container: false

      - name: SAM Validate
        run: sam validate --template infrastructure/template.yaml

      - name: SAM Build
        run: sam build --template infrastructure/template.yaml

  validate-frontend:
    name: Frontend Lint & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Validate HTML
        run: npm run lint:html

      - name: Validate CSS
        run: npm run lint:css

      - name: Validate JavaScript
        run: npm run lint:js
